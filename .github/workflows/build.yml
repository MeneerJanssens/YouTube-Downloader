name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yt-dlp pillow pyinstaller

      - name: Generate icons
        run: python create_icon.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --name YTD ytd.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --icon=icon.png --add-data "icon.ico:." --name YTD ytd.py

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../YTD-mac.zip YTD.app

      - name: Upload Windows exe to release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YTD.exe

      - name: Upload macOS zip to release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: YTD-mac.zip
